<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bingo Game</h1>

    <div class="input-container">
        <h3>Enter Number of Rows and Columns:</h3>
        <input type="number" id="inputRows" placeholder="Rows" min="1">
        <input type="number" id="inputCols" placeholder="Columns" min="1">
        <button id="startGame">Start New Game</button>
    </div>

    <div class="game-container">
        <div class="player">
            <h2>Player 1</h2>
            <div id="player1"></div>
        </div>
        <div class="player">
            <h2>Player 2</h2>
            <div id="player2"></div>
        </div>
    </div>

    <div class="input-container">
        <h3>Enter a Number:</h3>
        <input type="number" id="inputNumber" placeholder="Enter number" min="1">
        <button id="nextNumber" disabled>Submit Number</button>
    </div>

    <h3>Current Number: <span id="currentNumber">-</span></h3>
    <h2 id="winner"></h2>

    <script src="script.js"></script>
</body>
</html>
